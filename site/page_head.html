<title>Conversation Psychometrics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a single reading column (max 72rem) of stacked sections; the explorer is a two-pane instrument (chart + chat log) that stacks on phones. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #5a6573;
  --rule: #dde1e7;
  --accent: #1d5c86;
  --accent-soft: #e3eef6;
  --c-lone: #5b4fc4;
  --c-stress: #c27a12;
  --c-mood: #2c7f8f;
  --c-esteem: #b8476a;
  --pass: #1f7a4d;
  --pass-soft: #e2f3ea;
  --fail: #b23a32;
  --fail-soft: #f9e5e3;
  --pii: #fde9b8;
  --pii-ink: #6b4a00;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #19212a; --ink: #e6ebf0; --muted: #9aa6b4; --rule: #2b3541;
    --accent: #7db8e0; --accent-soft: #1d2f3e;
    --c-lone: #a49bf0; --c-stress: #e8a845; --c-mood: #5fc0d0; --c-esteem: #e88aa8;
    --pass: #5cc98f; --pass-soft: #173426; --fail: #ef7d74; --fail-soft: #3a1d1b;
    --pii: #4a3a12; --pii-ink: #f7dc94; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #19212a; --ink: #e6ebf0; --muted: #9aa6b4; --rule: #2b3541;
  --accent: #7db8e0; --accent-soft: #1d2f3e;
  --c-lone: #a49bf0; --c-stress: #e8a845; --c-mood: #5fc0d0; --c-esteem: #e88aa8;
  --pass: #5cc98f; --pass-soft: #173426; --fail: #ef7d74; --fail-soft: #3a1d1b;
  --pii: #4a3a12; --pii-ink: #f7dc94; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 1.0625rem/1.6 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 72rem; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 5vw, 3.25rem); font-weight: 700; }
h2 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 500; }
p { margin: 0; max-width: 65ch; }
a { color: var(--accent); }
.label { font: 600 0.75rem/1.2 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* nav */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topbar .wrap { display: flex; gap: 1rem 1.5rem; align-items: center; justify-content: space-between; flex-wrap: wrap; padding-block: 0.7rem; }
.brand { font: 700 1rem var(--f-display); }
.nav { display: flex; gap: 0.25rem 1.1rem; flex-wrap: wrap; font-size: 0.95rem; }
.nav a { color: var(--muted); text-decoration: none; }
.nav a:hover { color: var(--ink); }

section { padding-block: 3.5rem; border-bottom: 1px solid var(--rule); }
section:last-of-type { border-bottom: 0; }
.section-head { display: grid; gap: 0.6rem; margin-bottom: 2rem; }

/* hero */
.hero { padding-block: 3.5rem 3rem; display: grid; gap: 1.25rem; }
.hero .lede { font-size: 1.2rem; color: var(--muted); }
.sim-flag { display: inline-flex; align-items: center; gap: 0.5rem; width: fit-content; padding: 0.3rem 0.7rem; border: 1px dashed var(--accent); border-radius: 999px; color: var(--accent); font: 600 0.8rem var(--f-mono); }
.facts { display: flex; flex-wrap: wrap; gap: 0.75rem 2.25rem; margin-top: 0.5rem; }
.fact { display: grid; }
.fact b { font: 700 1.6rem var(--f-display); font-variant-numeric: tabular-nums; }
.fact span { color: var(--muted); font-size: 0.9rem; }
.authors { color: var(--muted); font-size: 0.95rem; }

/* steps */
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; }
.step { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 1.1rem 1.2rem; display: grid; gap: 0.5rem; align-content: start; }
.step .n { font: 600 0.8rem var(--f-mono); color: var(--accent); }
.step p { font-size: 0.97rem; color: var(--muted); }

/* explorer */
.controls { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: end; margin-bottom: 1rem; }
.field { display: grid; gap: 0.3rem; }
select, input[type="text"], textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 0.45rem 0.6rem; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: 600 0.9rem var(--f-body); border: 0; background: transparent; color: var(--muted); padding: 0.45rem 0.8rem; cursor: pointer; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
.seg button .dot { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; margin-right: 0.4rem; vertical-align: 0.05rem; }
.btn { font: 600 0.9rem var(--f-body); border: 1px solid var(--rule); background: var(--surface); color: var(--ink); padding: 0.45rem 0.8rem; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.person-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
.tag { font: 600 0.78rem var(--f-mono); padding: 0.2rem 0.55rem; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.tag.warn { background: var(--pii); color: var(--pii-ink); }

.explorer { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
@media (max-width: 860px) { .explorer { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 1rem 1.1rem; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
.chart-box { width: 100%; overflow-x: auto; }
svg text { fill: var(--muted); font: 11px var(--f-mono); }
.legend { display: flex; gap: 1.1rem; flex-wrap: wrap; font-size: 0.88rem; color: var(--muted); margin-top: 0.4rem; }
.legend i { display: inline-block; width: 1.4rem; height: 0; border-top: 2.5px solid; vertical-align: middle; margin-right: 0.35rem; }
.legend i.dash { border-top-style: dashed; }
.rline { margin-top: 0.6rem; font-size: 0.92rem; color: var(--muted); }

.daybar { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.75rem; }
.daybar button { font: 600 0.8rem var(--f-mono); width: 2.1rem; height: 2.1rem; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); color: var(--muted); cursor: pointer; }
.daybar button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.dayinfo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.4rem; margin-bottom: 0.8rem; }
.dayinfo div { border: 1px solid var(--rule); border-radius: 6px; padding: 0.35rem 0.45rem; display: grid; gap: 0.1rem; }
.dayinfo .k { font-size: 0.72rem; color: var(--muted); }
.dayinfo .v { font: 600 0.9rem var(--f-mono); }
.chat { display: grid; gap: 0.55rem; }
.bubble { justify-self: end; max-width: 92%; background: var(--accent-soft); border-radius: 12px 12px 3px 12px; padding: 0.5rem 0.7rem; display: grid; gap: 0.4rem; }
.bubble .txt { overflow-wrap: anywhere; }
.redact { background: var(--pii); color: var(--pii-ink); border-radius: 4px; padding: 0 0.25rem; font: 600 0.82em var(--f-mono); }
.maskw { background: var(--rule); border-radius: 4px; padding: 0 0.25rem; font: 600 0.82em var(--f-mono); color: var(--muted); }
.scores { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.35rem; }
.sc { display: grid; gap: 0.1rem; font: 0.7rem var(--f-mono); color: var(--muted); }
.track { height: 5px; border-radius: 3px; background: var(--rule); position: relative; overflow: hidden; }
.track span { position: absolute; top: 0; bottom: 0; left: 50%; }
.ai-note { justify-self: start; font-size: 0.85rem; color: var(--muted); font-style: italic; }

/* try it */
.try { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
@media (max-width: 760px) { .try { grid-template-columns: minmax(0, 1fr); } }
textarea { width: 100%; min-height: 6.5rem; resize: vertical; }
.examples { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
.examples button { font: 0.85rem var(--f-body); border: 1px dashed var(--rule); background: transparent; color: var(--muted); border-radius: 999px; padding: 0.2rem 0.6rem; cursor: pointer; }
.examples button:hover { color: var(--ink); border-color: var(--accent); }
.bars { display: grid; gap: 0.7rem; }
.bar-row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) 3.5rem; gap: 0.6rem; align-items: center; font-size: 0.95rem; }
.bar-row .track { height: 10px; }
.bar-row .val { text-align: right; }
.cover { font-size: 0.88rem; color: var(--muted); margin-top: 0.75rem; }
.scrubbed { margin-top: 0.75rem; font-size: 0.92rem; padding: 0.5rem 0.7rem; border-radius: 8px; border: 1px solid var(--rule); overflow-wrap: anywhere; }

/* results */
.res-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
.res-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 1rem 1.1rem; display: grid; gap: 0.7rem; align-content: start; }
.res-card h3 { display: flex; align-items: center; gap: 0.5rem; }
.res-card h3 .dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; }
.verdict { font: 600 0.78rem var(--f-mono); padding: 0.2rem 0.55rem; border-radius: 999px; width: fit-content; }
.verdict.ok { background: var(--pass-soft); color: var(--pass); }
.verdict.no { background: var(--fail-soft); color: var(--fail); }
.test { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr); gap: 0.4rem; font-size: 0.93rem; }
.test .ic { font: 700 0.9rem var(--f-mono); }
.test .ic.ok { color: var(--pass); } .test .ic.no { color: var(--fail); }
.test small { display: block; color: var(--muted); font-family: var(--f-mono); font-size: 0.78rem; }
.matrix-wrap { margin-top: 2rem; display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 1.5rem 2rem; align-items: start; }
@media (max-width: 760px) { .matrix-wrap { grid-template-columns: minmax(0, 1fr); } }
.matrix-scroll { overflow-x: auto; }
table.matrix { border-collapse: separate; border-spacing: 3px; font: 0.85rem var(--f-mono); }
table.matrix th { font-weight: 600; color: var(--muted); padding: 0.3rem 0.4rem; text-align: center; font-size: 0.75rem; }
table.matrix th[scope="row"] { text-align: right; }
table.matrix td { width: 4.2rem; height: 2.6rem; text-align: center; border-radius: 5px; color: var(--ink); }
table.matrix td.diag { outline: 2px solid var(--accent); outline-offset: -2px; font-weight: 600; }

/* traps */
.traps { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1rem; }
.trap { border-top: 3px solid var(--accent); padding-top: 0.9rem; display: grid; gap: 0.5rem; align-content: start; }
.trap p { color: var(--muted); font-size: 0.97rem; }
.ex { font-size: 0.9rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 0.5rem 0.7rem; overflow-wrap: anywhere; }

.limits { display: grid; gap: 0.9rem; }
.limits p { color: var(--ink); }
footer { padding-block: 2rem 3rem; color: var(--muted); font-size: 0.9rem; display: grid; gap: 0.4rem; }
@media (prefers-reduced-motion: no-preference) { .track span, .bar-row .track span { transition: width .25s ease, left .25s ease; } }
</style>
